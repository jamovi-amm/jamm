---
name:  jammGLM
title: GLM Mediation Analysis
jrs: '1.0'


items:
  - name: model
    type: Property
    description: The underlying `lavaan` object

## these are handled by SmartInfo class
  -   name: info
      title: Introduction
      type: Html
  -   name: extrainfo
      title: Extra Info
      type: Html
      visible: false
  -   name: issues
      title: Issues
      type: Html
      visible: false

## tables are filled with SmartTabs class which requires that the clearWith field be complete and accurate
## Double check that the options listed in clearWith are correct for all tables.

  - name: infotab
    title: Models Info
    type: Table
    columns:
       - name: info
         type: text
         title: ""
         combineBelow: true

       - name: value
         type: text
         title: ""
    clearWith: &modelDependencies
        - data
        - dep
        - mediators
        - factors
        - covs
        - modelTerms
        - mediatorsTerms
        - moderatorsTerms
        - contrasts
        - scaling
        - ciType
        - ciWidth
        - bootN
        - simpleScale
        - cvalue
        - percvalue
        - simpleScaleLabels
        - tableOptions
        - showRealNames
    refs: jamm




  - name: models
    title: "Mediation"
    type: Group
    visible: false
    clearWith: *modelDependencies
    items:
    
          - name: r2
            title: R-squared
            type: Table
            clearWith: *modelDependencies

            columns:
                    - name: lhs
                      title: "Variable"
                      type: text
                    - name: r2
                      title: R²
                      type: number
                    - name: ci.lower
                      type: number
                      title: Lower
                      visible: (ciType != 'none')
                      format: zto
                    - name: ci.upper
                      type: number
                      title: Upper
                      visible: (ciType != 'none')
                      format: zto

    
          - name: interactions
            title: Moderation effects (interactions)
            visible: false
            type: Table
            clearWith: *modelDependencies
            columns:
                    - name: lhs
                      title: "Dependent"
                      combineBelow: true
                      type: text
                    - name: rhs
                      title: "Interaction"
                      type: text
                    - name: est
                      title: "Estimate"
                      type: number
                    - name: se
                      title: "SE"
                      type: number
                    - name: ci.lower
                      type: number
                      title: Lower
                      visible: (ciType != 'none')
                    - name: ci.upper
                      type: number
                      title: Upper
                      visible: (ciType != 'none')

                    - name: std.all
                      type: number
                      title: β
                      visible: (tableOptions:beta)
                    - name: z
                      title: "z"
                      type: number
                    - name: pvalue
                      title: "p"
                      type: number
                      format: zto,pvalue
    
          - name: coefficients
            title: Indirect and Total Effects
            type: Table
            refs: lavaan
            clearWith: *modelDependencies
            columns:
                    - name: condition
                      title: Moderator levels
                      type: text
                      visible: false
                      combineBelow: true
                    - name: type
                      title: "Type"
                      type: text
                      combineBelow: true
                    - name: effect
                      title: "Effect"
                      type: text
                    - name: label
                      title: "Contrasts"
                      visible: false
                      type: text
                    - name: est
                      title: "Estimate"
                      type: number
                    - name: se
                      title: "SE"
                      type: number
                    - name: ci.lower
                      type: number
                      title: Lower
                      visible: (ciType != 'none')
                    - name: ci.upper
                      type: number
                      title: Upper
                      visible: (ciType != 'none')
                    - name: std.all
                      type: number
                      title: β
                      visible: (tableOptions:beta)
                    - name: z
                      title: "z"
                      type: number
                    - name: pvalue
                      title: "p"
                      type: number
                      format: zto,pvalue


          - name: contrastCodeTable
            title: Contrasts Definition
            type: Table
            visible: false
            clearWith:
                - data
                - factors
                - contrasts
                - showRealNames
            columns:
                         - name: rname
                           title: 'Name'
                           type: text
                         - name: clab
                           title: 'Contrast'
                           type: text

          - name: contrastCodeTables
            title: Contrast Coefficients
            type: Array
            visible: (showContrastCode)
            items: (factors)
            clearWith: &contrastTableDependencies
                - factors
                - contrasts
                - showContrastCode
                - data
            template:
                title: $key
                type: Table
                clearWith: *contrastTableDependencies
                columns:
                    - name: cname
                      title: Name
                      type: text
                    - name: clab
                      title: Contrast
                      type: text


  - name: regressions
    type: Group
    title: ""
    visible: (tableOptions:regression)

    clearWith: *modelDependencies
        
    items:
          - name: overall
            title: Total effects
            type: Group
            visible: (tableOptions:regression)

            clearWith: *modelDependencies

            items:
               - name: anova
                 title: ANOVA Table
                 type: Table
                 visible: (tableOptions:regression)
                 clearWith: *modelDependencies
                 columns:
                    - name: dep
                      title: Variable
                      type: text
                    - name: rsquared
                      title: R-squared
                      type: number
                    - name: f
                      type: number
                      title: F
                    - name: df1
                      title: "df1"
                      type: number
                    - name: df2
                      title: "df2"
                      type: number
                    - name: p
                      title: "p"
                      type: number
                      format: zto,pvalue
               - name: regression
                 title: Regression Table
                 type: Table
                 visible: (tableOptions:regression)
                 clearWith: *modelDependencies

                 columns:
                    - name: source
                      title: "Names"
                      type: text
                      visible: (showRealNames)
                    - name: label
                      title: "Effect"
                      type: text
                    - name: estimate
                      title: "Estimate"
                      type: number
                    - name: se
                      title: "SE"
                      type: number
                    - name: ci.lower
                      type: number
                      title: Lower
                      visible: (ciType != 'none')
                    - name: ci.upper
                      type: number
                      title: Upper
                      visible: (ciType != 'none')
                    - name: beta
                      type: number
                      title: β
                      visible: (tableOptions:beta)
                    - name: df
                      title: "df"
                      type: number
                    - name: t
                      title: "t"
                      type: number
                    - name: p
                      title: "p"
                      type: number
                      format: zto,pvalue


          - name: mediator_regressions
            title: Mediator Models
            type: Array
            description: an array of regressions for the mediators
            clearWith: *modelDependencies

            template:
                clearWith: *modelDependencies
                title:  "Regression model for"
                type: Group
                items:
                   - name: anova
                     type: Table
                     title: ANOVA
                     clearWith: *modelDependencies
                     columns:
                         - name: lhs
                           title: Variable
                           type: text
                         - name: rsquared
                           title: "R-squared"
                           type: number
                         - name: f
                           type: number
                           title: F
                         - name: df1
                           title: "df1"
                           type: number
                         - name: df2
                           title: "df2"
                           type: number
                         - name: p
                           title: "p"
                           type: number
                           format: zto,pvalue
                   - name: regression
                     type: Table
                     title: Regression
                     clearWith: *modelDependencies
                     visible: (tableOptions:regression)
                     columns:
                         - name: lhs
                           title: "Dependent"
                           type: text
                           combineBelow: true
                         - name: rhs
                           title: "Effect"
                           type: text
                         - name: estimate
                           title: "Estimate"
                           type: number
                         - name: se
                           title: "SE"
                           type: number
                         - name: ci.lower
                           type: number
                           title: Lower
                           visible: (ciType != 'none')
                         - name: ci.upper
                           type: number
                           title: Upper
                           visible: (ciType != 'none')
                         - name: beta
                           type: number
                           title: β
                           visible: (tableOptions:beta)
                         - name: df
                           title: "df"
                           type: number
                         - name: t
                           title: "t"
                           type: number
                         - name: p
                           title: "p"
                           type: number
                           format: zto,pvalue

          - name: full
            title: Full model effects
            type: Group
            visible: (tableOptions:regression)
            clearWith: *modelDependencies
            items:
               - name: anova
                 title: ANOVA Table
                 type: Table
                 visible: (tableOptions:regression)
                 clearWith: *modelDependencies
                 columns:
                    - name: lhs
                      title: Dependent
                      type: text
                      combineBelow: true
                    - name: rsquared
                      title: R-squared
                      type: number
                    - name: f
                      type: number
                      title: F
                    - name: df1
                      title: "df1"
                      type: number
                    - name: df2
                      title: "df2"
                      type: number
                    - name: p
                      title: "p"
                      type: number
                      format: zto,pvalue
               - name: regression
                 title: Regression Table
                 visible: (tableOptions:regression)
                 type: Table
                 clearWith: *modelDependencies
                 columns:
                    - name: lhs
                      title: Dependent
                      type: text
                      combineBelow: true
                    - name: rhs
                      title: Effect
                      type: text
                    - name: estimate
                      title: "Estimate"
                      type: number
                    - name: se
                      title: "SE"
                      type: number
                    - name: ci.lower
                      type: number
                      title: Lower
                      visible: (ciType != 'none')
                    - name: ci.upper
                      type: number
                      title: Upper
                      visible: (ciType != 'none')
                    - name: beta
                      type: number
                      title: β
                      visible: (tableOptions:beta)
                    - name: df
                      title: "df"
                      type: number
                    - name: t
                      title: "t"
                      type: number
                    - name: p
                      title: "p"
                      type: number
                      format: zto,pvalue

  - name: pathgroup
    type: Group
    title: Path Model
    visible: (diagram | meddiagram)
    clearWith: &pathDiagramDependencies
                  - data
                  - dep
                  - mediators
                  - factors
                  - covs
                  - mediatorsTerms
                  - modelTerms
                  - moderatorsTerms
                  - contrasts
                  - scaling
                  - ciType
                  - ciWidth
                  - bootN
                  - simpleScale
                  - cvalue
                  - percvalue
                  - simpleScaleLabels
                  - pathOptions
                  - meddiagram
                  - diagram
                  - diag_paths
                  - diag_resid
                  - diag_labsize
                  - diag_rotate
                  - diag_type
                  - diag_shape
                  - diag_abbrev

    items:
            - name: pathmodel
              title: Model Diagram
              visible: (meddiagram)
              type: Image
              description: a model diagram
              width: 600
              height: 500
              renderFun: .showModelDiagram
              clearWith: &modelDiagramDependencies
                  - data
                  - dep
                  - mediators
                  - factors
                  - covs
                  - mediatorsTerms
                  - modelTerms
                  - moderatorsTerms
                  - pathOptions
                  - meddiagram
              refs: diagram    
            - name: pathnotes
              type: Table
              title: ""
              visible: false
              clearWith: *modelDiagramDependencies
              columns:
                  - name: info
                    type: text
                    title: "Model diagram notes"
    
            - name: diagrams
              title: Path Diagrams
              type: Array
              description: an array of path diagrams
              visible: (diagram)
              clearWith: *pathDiagramDependencies
              template:
                   title: $key
                   type: Image
                   renderFun: .showDiagram
                   width: 700
                   height: 500
                   clearWith: *pathDiagramDependencies

              refs: semplot
             
            - name: notes
              type: Table
              title: ""
              visible: false
              clearWith: *pathDiagramDependencies
              columns:
                  - name: message
                    type: text
                    title: "Path diagram notes"

