---
name: jammGLM
title: GLM Mediation Model
menuGroup: medmod
menuSubgroup: jAMM
menuTitle: GLM Mediation Model
version: '1.0.5'
jas: '1.2'
# The R interface is maintained in R/jammglm.f.R, as in GAMLj.
export: false
completeWhenFilled: false
description:
    main: GLM mediation model
    R:
        dontrun: true
formula:
   dep:
     custom: true
   factors: 
     custom: true
   covs: 
     custom: true
   mediators: 
     custom: true
   mediatorsTerms: 
     custom: true
   modelTerms:
     custom: true
   mod_terms:
     custom: true
   simpleScale:
     custom: true
   
options:
    - name: data
      type: Data
      description:
          R: >
            the data as a data frame. Categorical variables used as `factors` must be factors.

    - name: dep
      title: Dependent variable
      type: Variable
      default:
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
      description:
          R: >
            a string naming the dependent variable from `data`; the variable must be numeric. Required unless `formula` is given.
          ui: >
            The dependent variable: the final outcome, predicted by the mediators and the independent variables. It must be numeric (continuous or ordinal).

    - name: mediators
      title: Mediators
      type: Variables
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
      default:
      description:
          R: >
            a vector of strings naming the mediators from `data`. Required unless `formula` is given.
          ui: >
            One or more numeric variables that transmit the effect of the independent variables on the dependent variable. Each mediator has its own regression model, set in Mediator Models.

    - name: factors
      title: Factors
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default:
      description:
          R: >
            a vector of strings naming the categorical independent variables (factors) from `data`. Derived from `formula` when it is given; otherwise at least one of `factors` or `covs` is required.
          ui: >
            Categorical independent variables. Each factor enters the models as contrast variables (a factor with k levels gives k-1 contrasts, each with its own effects), coded as set in Factor Coding. At least one factor or covariate is needed.

    - name: covs
      title: Covariates
      type: Variables
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
      default:
      description:
          R: >
            a vector of strings naming the continuous independent variables (covariates) from `data`. Derived from `formula` when it is given; otherwise at least one of `factors` or `covs` is required.
          ui: >
            Continuous independent variables. They are scaled as set in Covariate Scaling (centered by default). At least one factor or covariate is needed.



    - name: modelTerms
      title: Model terms
      type: Terms
      default:
      description:
          R: >
            a list of terms (character vectors) predicting the dependent variable in the full model, e.g. `list("m", "x", c("m", "w"))` for `y ~ m + x + m:w`. Required unless `formula` is given.
          ui: >
            Full Model: the terms predicting the dependent variable, that is the mediators, the independent variables with a direct effect, and their interactions. An independent variable left out of the full model has no direct effect: the effects table shows its direct effect fixed to 0.


    - name: ciType
      title: Confidence Intervals
      type: List
      options:
        - name: standard
          title: Standard
        - name: bca
          title: Bootstrap (BC)
        - name: perc
          title: Bootstrap (Percent)
        - name: norm
          title: Bootstrap (Normal)
        - name: none
          title: None
      default: standard
      description:
          R: >
            confidence interval type: `'standard'` (default, delta method), `'bca'` (bias-corrected bootstrap), `'perc'` (percentile bootstrap), `'norm'` (normal bootstrap), or `'none'`.
          ui: >
            Confidence intervals of the estimates: Standard (delta method, the default), Bootstrap (BC) for bias-corrected bootstrap intervals, Bootstrap (Percent) for percentile bootstrap intervals, Bootstrap (Normal) for normal-theory bootstrap intervals, or None.


    - name: ciWidth
      title: Confidence level
      type: Number
      min: 50
      max: 99.9
      default: 95
      description:
          R: >
            a number between 50 and 99.9 (default: 95) specifying the confidence interval width for the parameter estimates
          ui: >
            Interval: the confidence level of the intervals, between 50 and 99.9 (default 95%).

    - name: bootN
      title: Bootstrap samples
      type: Integer
      min: 50
      default: 1000
      description:
          R: >
            integer number of bootstrap samples (at least 50) for estimating confidence intervals
          ui: >
            Bootstrap samples: the number of bootstrap samples (at least 50, default 1000) used when a bootstrap interval is selected.

    - name: contrasts
      title: Factor Coding
      type: Array
      items: (factors)
      default: 
      template:
          type: Group
          elements:
              - name: var
                type: Variable
                content: $key
              - name: type
                type: List
                options:
                  - simple
                  - deviation
                  - dummy
                  - difference
                  - helmert
                  - repeated
                  - polynomial
                default: simple
      description:
          R: >
            the coding of each factor, one of `'simple'`, `'deviation'`, `'dummy'`, `'difference'`, `'helmert'`, `'repeated'` or `'polynomial'`, given either as a list of lists, e.g. `list(list(var = "group", type = "dummy"))`, or as a named vector, e.g. `c(group = "dummy")`. Factors not listed use `'simple'` coding (the default, as in jamovi).
          ui: >
            Factor Coding: how each factor is coded into contrast variables. `simple` (default) compares each level with the first one, centered; `deviation` compares each level with the mean of all levels; `dummy` compares each level with the first one, not centered; `difference` compares each level with the mean of the previous levels; `helmert` compares each level with the mean of the following levels; `repeated` compares each level with the next one; `polynomial` estimates linear, quadratic and higher trends. The Contrasts Definition table shows what each contrast compares.


    - name: showRealNames
      title: Names in estimates table
      type: Bool
      default: true
      description:
          R: >
            `TRUE` (default) or `FALSE`; when the model has factors, show which variable each contrast is and what it compares: a Contrast column in the indirect and total effects table, with the comparison each contrast makes (e.g. `2 - 1`), and a Names column in the regression tables, with the name of each contrast variable (e.g. `group1`) next to the Effect column, which shows the comparison.
          ui: >
            Names in estimates table: when the model has factors, adds a Contrast column to the Indirect and Total Effects table, showing the comparison each factor contrast makes (e.g. 2 - 1, as in the Contrasts Definition table; empty for continuous variables), and a Names column to the regression tables (shown when Individual regressions is selected), with the name of each contrast variable (e.g. group1) next to its comparison.


    - name: showContrastCode
      title: Contrast coefficients tables
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide contrast coefficients tables
          ui: >
            Contrast coefficients tables: shows, for each factor, the values given to each of its levels in each contrast.





    - name: simpleScale
      title: Covariate Conditioning
      type: List
      options:
        - name: mean_sd
          title: Mean ± SD
        - name: percent
          title: Percentiles 50 ± offset
      default: mean_sd
      description:
          R: >
            `'mean_sd'` (default) uses the mean and offsets of `cvalue` standard deviations; `'percent'` uses the median and percentile offsets of `percvalue` for continuous moderators.
          ui: >
            Covariate Conditioning: the values of continuous moderators at which the conditional effects are computed. Mean ± SD uses the mean and the mean plus and minus the number of standard deviations set in the box (default 1); Percentiles 50 ± offset uses the median and the percentiles at the offset set in the box (default 25, i.e. the 25th, 50th and 75th percentiles).


    - name: cvalue
      type: Number
      min: 0.1
      default: 1
      description:
          R: >
            standard-deviation offset for conditioning (at least 0.1)
          ui: >
            The number of standard deviations around the mean (at least 0.1, default 1) used by Mean ± SD.

    - name: percvalue
      type: Number
      default: 25
      min: 5
      max: 50
      description:
          R: >
            percentile offset from the median, between 5 and 50 (default: 25).
          ui: >
            The percentile offset around the median (between 5 and 50, default 25) used by Percentiles 50 ± offset.

    - name: simpleScaleLabels
      title: Covariate Labeling
      type: List
      options:
        - name: labels
          title: Labels
        - name: values
          title: Values
        - name: values_labels
          title: Values + labels
      default: labels
      description:
          R: >
            moderator setting labels: `'labels'` (default), `'values'`, or `'values_labels'`.
          ui: >
            Covariate Labeling: how the values of continuous moderators are labelled in the tables. Labels shows the setting (e.g. Mean + 1 SD), Values shows the moderator's value, Values + labels shows both.


############ generic with some specs ###########


    - name: scaling
      title: Covariate Scaling
      type: Array
      items: (covs)
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
                content: $key
              - name: type
                type: List
                options:
                  - centered
                  - standardized
                  - none

                default: centered 
      description:
          R: >
            the scaling of each covariate and mediator, one of `'centered'`, `'standardized'` or `'none'` (the variable is left as it is), given either as a list of lists, e.g. `list(list(var = "x", type = "standardized"))`, or as a named vector, e.g. `c(x = "standardized")`. Covariates and mediators not listed are centered (the default, as in jamovi).
          ui: >
            Covariate Scaling: how each covariate and mediator is transformed before estimation. `centered` (default) subtracts the mean; `standardized` also divides by the standard deviation; `none` leaves the variable as it is. With interactions in the models, centering makes the lower-order effects the effects at the mean of the other variable.


######### specs here ##########

    - name: tableOptions
      type: NMXList
      options:
          - name: component
            title: Indirect effect components
          - name: beta
            title: β
          - name: regression
            title: Individual regressions

      default:
          - beta
          - component
      description:
          R: >
            optional table content: `'beta'` and `'component'` (both selected by default), and `'regression'`.
          ui: >
            Display in Tables: Indirect effect components adds the individual paths of each indirect effect; β adds the standardized coefficients; Individual regressions adds ANOVA and coefficient tables for the total-effects model, each mediator model and the full model.

    - name: pathOptions
      type: NMXList
      options:
          - name: suggested
            title: Suggested paths
      default:
          - suggested
      description:
          R: >
            include `'suggested'` (default) to show suggested paths in the conceptual model diagram without changing the fitted model.
          ui: >
            Suggested paths: shows in green, in the model diagram, paths that a mediation model usually includes but that are not in the specified models. They are not estimated.
          
    - name: mediatorsTerms
      title: Mediator Models
      type: Array
      default: [[]]
      template:
          type: Terms
      description:
          R: >
            a list with one element per mediator, in the order of `mediators`, each a list of terms (character vectors) predicting that mediator, e.g. `list(list("x", "w", c("x", "w")))` for `m ~ x + w + x:w`. Required unless `formula` is given.
          ui: >
            Mediator Models: for each mediator, the terms predicting it, that is the independent variables (and other mediators, for serial mediation) and their interactions.

    - name: mod_terms
      title: Moderator Effects
      type: Array
      default: [[]]
      template:
          type: Terms
      description:
          R: >
            (optional) a list with one element per mediator, in the order of `mediators`, each listing the variables that moderate that mediated effect, e.g. `list(list("w"))`. The interactions themselves must be included in `mediatorsTerms` and `modelTerms` (or in `formula`). Not derived from `formula`. Categorical moderators include each factor level and an Average setting at the equal-level contrast centroid (zero for centered factor coding). Indirect effects at Average are products of the centered-factor slopes, not averages of the level-specific indirect effects.
          ui: >
            Moderators: for each mediator, the independent variables that moderate its mediated effect. The needed interactions are added to the models automatically. Indirect, direct and total effects are then computed at different values of the moderators: for a continuous moderator as set in Covariate Conditioning, for a categorical moderator at each level and at their average. At least one independent variable must remain outside the moderators.

    # ------------------------------------------------------------------
    # LEGACY (jAMM < 2.0): `moderatorsTerms` was renamed `mod_terms` in 2.0.
    # Kept as a hidden option (no panel control) only so that analyses saved
    # with jAMM 1.x reopen with their moderators. Its value is moved into
    # `mod_terms` by migrate_legacy_options() (R/legacy.R) and by
    # migrateLegacyModerators() (jamovi/js/jamm.events.js).
    # TO REMOVE: delete this option and everything tagged "LEGACY (jAMM < 2.0)".
    # ------------------------------------------------------------------
    - name: moderatorsTerms
      title: Moderator Effects (legacy)
      type: Array
      hidden: true
      default: [[]]
      template:
          type: Terms
      description:
          R: >
            deprecated, use `mod_terms`. Accepted (with a warning) for scripts written for jAMM 1.x; ignored when `mod_terms` is also given.

#### path diagram ###

    - name: model_diagram
      title: Model diagram
      type: Bool
      default: true
      description:
          R: >
            `TRUE` (default) or `FALSE`; show the conceptual model diagram based on the specified regression terms.
          ui: >
            Model diagram: shows the conceptual diagram of the specified model, with the moderators on the paths they moderate.



    - name: path_diagram
      title: Path diagram
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default); show the statistical path diagram based on the fitted model.
          ui: >
            Path diagram: shows the statistical path diagram of the fitted model, with every estimated path. Its appearance is set by the options below.

    - name: diag_paths
      title: Path labels
      type: List
      options:
        - name:  est
          title: Coefficients
        - name: stand
          title: Betas
        - name: name
          title: Labels
        - name: hide
          title: None
      default: est
      description:
          R: >
            statistical path labels: `'est'` (default) for coefficients, `'stand'` for standardized coefficients, `'name'` for parameter labels, or `'hide'` for no labels.
          ui: >
            Paths: the labels shown on the paths of the path diagram: Coefficients (default), Betas (standardized coefficients), Labels (parameter names) or None.

    - name: diag_resid
      title: Residuals
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default); show residuals in the statistical path diagram.
          ui: >
            Residuals: shows the residual variances in the path diagram.

    - name: diag_labsize
      title: Node size
      type: List
      options:
        - name:  small
          title: Small
        - name: medium
          title: Medium
        - name: large
          title: Large
        - name: vlarge
          title: Very large

      default: medium
      description:
          R: >
            statistical diagram node size: `'small'`, `'medium'` (default), `'large'`, or `'vlarge'`.
          ui: >
            Node size: the size of the variables' boxes in the path diagram: Small, Medium (default), Large or Very large.

    - name: diag_rotate
      title: Rotate
      type: List
      options:
        - name:  "1"
          title: Exogenous top
        - name: "2"
          title: Exogenous left
        - name: "3"
          title: Exogenous bottom
        - name: "4"
          title: Exogenous right

      default: "1"
      description:
          R: >
            exogenous-node position in the statistical diagram: `'1'` (top, default), `'2'` (left), `'3'` (bottom), or `'4'` (right). The mediation-like layout uses fixed positions.
          ui: >
            Rotate: where the independent variables are placed in the path diagram: Exogenous top (default), left, bottom or right. Not used by the Mediation-like layout; the circle layouts accept only top or bottom.
    - name: diag_type
      title: Type
      type: List
      options:
        - name: "mediation"
          title: Mediation-like
        - name: "circle"
          title: Circle
        - name: "circle2"
          title: Circle (alternative)

        - name:  "tree2"
          title: Tree-like
        - name:  "tree"
          title: Tree-like (alternative)
        - name: "spring"
          title: Spring

      default: "mediation"
      description:
          R: >
            statistical diagram layout: `'mediation'` (default), `'circle'`, `'circle2'`, `'tree2'`, `'tree'`, or `'spring'`.
          ui: >
            Type: the layout of the path diagram: Mediation-like (default; independent variables, mediators and dependent variable from left to right), Circle, Circle (alternative), Tree-like, Tree-like (alternative) or Spring.

    - name: diag_shape
      title: Shapes
      type: List
      options:
        - name:  "rectangle"
          title:  Rectangles
        - name:  "square"
          title:  Squares
        - name: "circle"
          title: Circles
        - name: "ellipse"
          title: Ellipses
        - name: "diamond"
          title: Diamonds

      default: "rectangle"
      description:
          R: >
            statistical diagram node shape: `'rectangle'` (default), `'square'`, `'circle'`, `'ellipse'`, or `'diamond'`.
          ui: >
            Shapes: the shape of the variables' boxes in the path diagram: Rectangles (default), Squares, Circles, Ellipses or Diamonds.


    - name: diag_abbrev
      title: Abbreviate
      type: List
      options:
        - name:  "0"
          title:  No abbreviation
        - name:  "5"
          title:  "5"
        - name:  "10"
          title:  "10"
        - name:  "15"
          title:  "15"
        - name:  "20"
          title:  "20"
        - name:  "25"
          title:  "25"
      default: "0"
      description:
          R: >
            minimum abbreviation length for statistical diagram node labels: `'0'` (default, no abbreviation), `'5'`, `'10'`, `'15'`, `'20'`, or `'25'`.
          ui: >
            Abbreviate: shortens the variable names in the path diagram to the chosen number of characters (default: no abbreviation).


