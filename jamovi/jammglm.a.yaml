---
name: jammGLM
title: GLM Mediation Model
menuGroup: medmod
menuSubgroup: jAMM
menuTitle: GLM Mediation Model
version: '1.0.5'
jas: '1.2'
# The R interface is maintained in R/jammglm.f.R, as in GAMLj.
export: false
completeWhenFilled: false
description:
    main: GLM mediation model
    R:
        dontrun: true
formula:
   dep:
     custom: true
   factors: 
     custom: true
   covs: 
     custom: true
   mediators: 
     custom: true
   mediatorsTerms: 
     custom: true
   modelTerms:
     custom: true
   mod_terms:
     custom: true
   simpleScale:
     custom: true
   
options:
    - name: data
      type: Data
      description:
          R: the data as a data frame

    - name: dep
      title: Dependent variable
      type: Variable
      default:
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
      description:
          R: >
            a string naming the dependent variable from `data`, variable
            must be numeric

    - name: mediators
      title: Mediators
      type: Variables
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
      default:
      description:
          R: a vector of strings naming the mediators from `data`

    - name: factors
      title: Factors
      type: Variables
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default:
      description:
          R: a vector of strings naming the fixed factors from `data`

    - name: covs
      title: Covariates
      type: Variables
      suggested:
        - continuous
        - ordinal
      permitted:
        - numeric
      default:
      description:
          R: a vector of strings naming the covariates from `data`



    - name: modelTerms
      title: Model terms
      type: Terms
      default:
      description:
          R: >
            a list of character vectors describing fixed effects terms


    - name: ciType
      title: Confidence Intervals
      type: List
      options:
        - name: standard
          title: Standard
        - name: bca
          title: Bootstrap (BC)
        - name: perc
          title: Bootstrap (Percent)
        - name: norm
          title: Bootstrap (Normal)
        - name: none
          title: None
      default: standard
      description:
          R: >
             Confidence interval type: `'standard'` (default, delta method), `'bca'` (bias-corrected
             bootstrap), `'perc'` (percentile bootstrap), `'norm'` (normal bootstrap), or `'none'`.


    - name: ciWidth
      title: Confidence level
      type: Number
      min: 50
      max: 99.9
      default: 95
      description:
          R: >
            a number between 50 and 99.9 (default: 95) specifying the confidence
            interval width for the parameter estimates

    - name: bootN
      title: Bootstrap samples
      type: Integer
      min: 50
      default: 1000
      description:
          R: >
            integer number of bootstrap samples (at least 50) for estimating confidence intervals

    - name: contrasts
      title: Factor Coding
      type: Array
      items: (factors)
      default: 
      template:
          type: Group
          elements:
              - name: var
                type: Variable
                content: $key
              - name: type
                type: List
                options:
                  - simple
                  - deviation
                  - dummy
                  - difference
                  - helmert
                  - repeated
                  - polynomial
                default: simple
      description:
          R: >
            a list of lists specifying the factor and type of contrast to use,
            one of `'simple'`, `'deviation'`, `'dummy'`, `'difference'`, `'helmert'`,
            `'repeated'` or `'polynomial'`


    - name: showRealNames
      title: Names in estimates table
      type: Bool
      default: true
      description:
          R: >
            `TRUE` (default) or `FALSE`; show the original variable names in contrast estimates.


    - name: showContrastCode
      title: Contrast coefficients tables
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide contrast coefficients tables





    - name: simpleScale
      title: Covariate Conditioning
      type: List
      options:
        - name: mean_sd
          title: Mean ± SD
        - name: percent
          title: Percentiles 50 ± offset
      default: mean_sd
      description:
          R: >
            `'mean_sd'` (default) uses the mean and offsets of `cvalue` standard deviations;
            `'percent'` uses the median and percentile offsets of `percvalue` for continuous moderators.


    - name: cvalue
      type: Number
      min: 0.1
      default: 1
      description:
          R: >
            standard-deviation offset for conditioning (at least 0.1)

    - name: percvalue
      type: Number
      default: 25
      min: 5
      max: 50
      description:
          R: >
            percentile offset from the median, between 5 and 50 (default: 25).

    - name: simpleScaleLabels
      title: Covariate Labeling
      type: List
      options:
        - name: labels
          title: Labels
        - name: values
          title: Values
        - name: values_labels
          title: Values + labels
      default: labels


############ generic with some specs ###########


    - name: scaling
      title: Covariate Scaling
      type: Array
      items: (covs)
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
                content: $key
              - name: type
                type: List
                options:
                  - centered
                  - standardized
                  - none

                default: centered 
      description:
          R: >
            a list of lists specifying the covariates scaling,
            one of `'centered'`, `'standardized'`, or `'none'`. `'none'` leaves the variable as it is


######### specs here ##########

    - name: tableOptions
      type: NMXList
      options:
          - name: component
            title: Indirect effect components
          - name: beta
            title: β
          - name: regression
            title: Individual regressions

      default:
          - beta
          - component

    - name: pathOptions
      type: NMXList
      options:
          - name: suggested
            title: Suggested paths
      default:
          - suggested
          
    - name: mediatorsTerms
      title: Mediator Models
      type: Array
      default: [[]]
      template:
          type: Terms
      description:
          R: >
            a list of lists specifying the models with the mediators as dependent variables.

    - name: mod_terms
      title: Moderator Effects
      type: Array
      default: [[]]
      template:
          type: Terms
      description:
          R: >
            a list of lists specifying the variables that moderate each mediated effect.

    # ------------------------------------------------------------------
    # LEGACY (jAMM < 2.0): `moderatorsTerms` was renamed `mod_terms` in 2.0.
    # Kept as a hidden option (no panel control) only so that analyses saved
    # with jAMM 1.x reopen with their moderators. Its value is moved into
    # `mod_terms` by migrate_legacy_options() (R/legacy.R) and by
    # migrateLegacyModerators() (jamovi/js/jamm.events.js).
    # TO REMOVE: delete this option and everything tagged "LEGACY (jAMM < 2.0)".
    # ------------------------------------------------------------------
    - name: moderatorsTerms
      title: Moderator Effects (legacy)
      type: Array
      hidden: true
      default: [[]]
      template:
          type: Terms
      description:
          R: >
            deprecated, use `mod_terms`. Accepted only for analyses and
            scripts written for jAMM 1.x.

#### path diagram ###

    - name: model_diagram
      title: Model diagram
      type: Bool
      default: true
      description:
          R: >
            `TRUE` (default) or `FALSE`; show the conceptual model diagram based on the specified regression terms.



    - name: path_diagram
      title: Path diagram
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default); show the statistical path diagram based on the fitted model.

    - name: diag_paths
      title: Path labels
      type: List
      options:
        - name:  est
          title: Coefficients
        - name: stand
          title: Betas
        - name: name
          title: Labels
        - name: hide
          title: None
      default: est
      description:
          R: >
             Statistical path labels: `'est'` (default) for coefficients, `'stand'` for standardized coefficients,
             `'name'` for parameter labels, or `'hide'` for no labels.

    - name: diag_resid
      title: Residuals
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default); show residuals in the statistical path diagram.

    - name: diag_labsize
      title: Node size
      type: List
      options:
        - name:  small
          title: Small
        - name: medium
          title: Medium
        - name: large
          title: Large
        - name: vlarge
          title: Very large

      default: medium
      description:
          R: >
             Statistical diagram node size: `'small'`, `'medium'` (default), `'large'`, or `'vlarge'`.

    - name: diag_rotate
      title: Rotate
      type: List
      options:
        - name:  "1"
          title: Exogenous top
        - name: "2"
          title: Exogenous left
        - name: "3"
          title: Exogenous bottom
        - name: "4"
          title: Exogenous right

      default: "1"
      description:
          R: >
             Exogenous-node position in the statistical diagram: `'1'` (top, default), `'2'` (left),
             `'3'` (bottom), or `'4'` (right). The mediation-like layout uses fixed positions.
    - name: diag_type
      title: Type
      type: List
      options:
        - name: "mediation"
          title: Mediation-like
        - name: "circle"
          title: Circle
        - name: "circle2"
          title: Circle (alternative)

        - name:  "tree2"
          title: Tree-like
        - name:  "tree"
          title: Tree-like (alternative)
        - name: "spring"
          title: Spring

      default: "mediation"
      description:
          R: >
             Statistical diagram layout: `'mediation'` (default), `'circle'`, `'circle2'`, `'tree2'`, `'tree'`, or `'spring'`.

    - name: diag_shape
      title: Shapes
      type: List
      options:
        - name:  "rectangle"
          title:  Rectangles
        - name:  "square"
          title:  Squares
        - name: "circle"
          title: Circles
        - name: "ellipse"
          title: Ellipses
        - name: "diamond"
          title: Diamonds

      default: "rectangle"
      description:
          R: >
             Statistical diagram node shape: `'rectangle'` (default), `'square'`, `'circle'`, `'ellipse'`, or `'diamond'`.


    - name: diag_abbrev
      title: Abbreviate
      type: List
      options:
        - name:  "0"
          title:  No abbreviation
        - name:  "5"
          title:  "5"
        - name:  "10"
          title:  "10"
        - name:  "15"
          title:  "15"
        - name:  "20"
          title:  "20"
        - name:  "25"
          title:  "25"
      default: "0"
      description:
          R: >
             Minimum abbreviation length for statistical diagram node labels: `'0'` (default, no abbreviation),
             `'5'`, `'10'`, `'15'`, `'20'`, or `'25'`.


### end diagram ###




